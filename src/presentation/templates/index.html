<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniAgent Enterprise Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>OmniAgent Enterprise 🧠</h1>
            <span class="badge" id="status-badge">Daemon Online</span>
        </header>

        <div class="card">
            <h2>Active Job Queue</h2>
            <div class="job-list" id="jobs-container" aria-live="polite">
                <p>Loading jobs...</p>
            </div>
        </div>

        <div class="card">
            <h2>System Intelligence</h2>
            <h3 id="skills-heading">Absorbed Skills Context (Majin Buu)</h3>
            <pre id="skills-container" aria-live="polite" tabindex="0" aria-labelledby="skills-heading">Loading skills...</pre>
            <h3 id="provenance-heading">External Repo Provenance (latest 5)</h3>
            <pre id="provenance-container" aria-live="polite" tabindex="0" aria-labelledby="provenance-heading">Loading provenance...</pre>
        </div>
    </main>
    <script src="/static/js/app.js"></script>
</body>
</html>
